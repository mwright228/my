name: temporary dependency refresh

on:
  push:
    branches:
      - security/network-repair

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'deps: refresh via runner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"
      - name: Regenerate module graph
        run: |
          go get github.com/sagernet/sing-box@v1.14.0
          go mod tidy
      - name: Commit generated module files
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "module files already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "deps: refresh via runner"
          git push origin HEAD:security/network-repair
