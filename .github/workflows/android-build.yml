name: Build NetPulse Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'src/tbrutal/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android NDK (r27b - 16KB page size aligned)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Compile Native Go Core (libmubxcore.so)
        run: |
          chmod +x android/build-native.sh
          ./android/build-native.sh

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NetPulse.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetPulse-Android15-Debug-APK
          path: NetPulse.apk
          retention-days: 14

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: netpulse-latest
          name: "NetPulse v1.2.0 (Stealth Edition)"
          body: |
            ### NetPulse • Network Diagnostics & Relay Suite
            - **Stealth Camouflage**: App opens to a legitimate, functional Network Diagnostics benchmark suite.
            - **Manual Freedom**: No hardcoded presets. User selects protocol (VLESS, Shadowsocks, ZiVPN, SSH, T-Brutal) and adds manual config.
            - **Human-Crafted Material 3 UI**: Clean developer aesthetic, no neon sci-fi clutter.
            - **Zero Black-Hole Routing**: Fixed deceptive 10808 fallback; active TCP RST prevents phone connection freeze.
          files: NetPulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
