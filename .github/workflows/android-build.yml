name: Build QuickNotes Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'src/tbrutal/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android NDK (r27b - 16KB page size aligned)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Compile Native Go Core (libmubxcore.so)
        run: |
          chmod +x android/build-native.sh
          ./android/build-native.sh

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk QuickNotes.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickNotes-Android15-Debug-APK
          path: QuickNotes.apk
          retention-days: 14

      - name: Publish Direct Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: quicknotes-latest
          name: "QuickNotes v2.1 (Stealth Edition)"
          body: |
            ### QuickNotes • Notes & Cloud Sync Relay Suite
            - **Authentic Camouflage**: Opens as a genuine, local note-taking app with search, markdown notes, and local storage.
            - **Discreet Unlock**: Long-press "QuickNotes" title or tap "Cloud Sync & Backup" to reveal the proxy controls.
            - **Minimalist One-Button UI**: Clean status card, large Start/Stop switch, and 1-tap clipboard import.
            - **Every MUB-X Protocol Supported**: Native client dialers for VLESS (WS & TCP), Trojan, VMess, Shadowsocks, SSH HTTP Custom, ZiVPN UDP, and T-Brutal.
            - **DNS-over-Tunnel**: Resolves hostnames through the encrypted proxy tunnel, solving "connected but no internet" on restricted mobile networks.
          files: QuickNotes.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
