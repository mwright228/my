name: Build MUB-X Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'src/tbrutal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/tbrutal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Setup Android NDK (r27b - 16KB page size aligned)
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27b
          add-to-path: true

      - name: Compile Native Go Core (libmubxcore.so)
        run: |
          chmod +x android/build-native.sh
          ./android/build-native.sh

      - name: Build optimized Android release APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease --stacktrace

      - name: Prepare release artifact
        run: |
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk MUB-X-release-unsigned.apk

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUB-X-Android-Release-Unsigned
          path: MUB-X-release-unsigned.apk
          retention-days: 14
