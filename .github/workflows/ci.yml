name: ci

on:
  push:
  pull_request:

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint shell scripts with shellcheck
        run: |
          scripts=()
          for f in install.sh bin/* lib/*.sh; do
            [ -f "$f" ] || continue
            if file "$f" | grep -qE 'ELF|Mach-O|binary' && ! file "$f" | grep -q 'text'; then
              continue
            fi
            if head -n 1 "$f" | grep -qE 'python|python3'; then
              continue
            fi
            scripts+=("$f")
          done
          shellcheck -S warning -e SC1091,SC2034,SC2120,SC2154 "${scripts[@]}"

      - name: Lint Python code with ruff
        run: |
          ruff check bin/mubx-chameleon tests/

      - name: Run unit tests with pytest
        run: |
          pytest -v tests/

      - name: Run comprehensive repository checks
        run: |
          bash .github/ci-check.sh
