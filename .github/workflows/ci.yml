# Temporary dependency-candidate hook; remove after the generated files are reviewed.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GOFLAGS: "-ldflags=-checklinkname=0"

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.7"

      - name: Generate sing-box 1.14.0 dependency candidate
        id: singbox_refresh
        if: github.event_name == 'push' && github.ref == 'refs/heads/security/network-repair'
        continue-on-error: true
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go get github.com/sagernet/sing-box@v1.14.0
          go mod tidy
          git diff -- go.mod go.sum > /tmp/singbox-upgrade.patch

      - name: Upload sing-box dependency candidate
        if: steps.singbox_refresh.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: singbox-1.14.0-candidate
          path: |
            go.mod
            go.sum
            /tmp/singbox-upgrade.patch

      - name: Fail dependency candidate job when generation failed
        if: steps.singbox_refresh.outcome == 'failure'
        run: exit 1

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Export JNI include paths
        run: |
          echo "CGO_CFLAGS=-I$JAVA_HOME/include -I$JAVA_HOME/include/linux" >> "$GITHUB_ENV"
          echo "CGO_CPPFLAGS=-I$JAVA_HOME/include -I$JAVA_HOME/include/linux" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff

      - name: Lint shell scripts with shellcheck
        run: |
          scripts=()
          for f in install.sh bin/* lib/*.sh; do
            [ -f "$f" ] || continue
            if file "$f" | grep -qE 'ELF|Mach-O|binary' && ! file "$f" | grep -q 'text'; then
              continue
            fi
            if head -n 1 "$f" | grep -qE 'python|python3'; then
              continue
            fi
            scripts+=("$f")
          done
          shellcheck -S warning -e SC1091,SC2034,SC2120,SC2154,SC2155,SC2318 "${scripts[@]}"

      - name: Lint Python code with ruff
        run: |
          ruff check --select E,F --ignore E501 bin/mubx-chameleon tests/

      - name: Populate Go module cache and sums
        run: go mod download all

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run Go race tests
        run: go test -race ./src/tbrutal/...

      - name: Run Go vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run unit tests with pytest
        run: pytest -v tests/

      - name: Run comprehensive repository checks
        run: bash .github/ci-check.sh
