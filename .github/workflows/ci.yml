name: ci

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (for the render smoke test)
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Run repository checks
        run: bash .github/ci-check.sh
