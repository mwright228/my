# MUB-X Squid HTTP CONNECT proxy (ports 8080 and 3128)
#
# Security model: the proxy must remain usable without credentials so
# "injector" clients can reach the tunnel from any carrier. To keep it from
# turning into a fully open proxy we only permit:
#   * CONNECT tunnelling to web ports (80/443) and SSH tunnel ports,
#   * plain (non-CONNECT) proxying to web ports only.
# CONNECT to arbitrary ports (mail relays, random hosts) and non-web
# traffic are explicitly denied.

http_port 8080
http_port 3128

# ACL Definitions
acl localhost src 127.0.0.1/32 ::1
acl CONNECT method CONNECT
acl Web_ports port 80 443
acl SSH_tunnel_ports port 22 109 2222

# Local administration always allowed
http_access allow localhost

# Injector CONNECT payloads: TLS to the bug-host/domain (443), plain web
# (80), and SSH tunnelling (22/109/2222) are the supported uses.
http_access allow CONNECT Web_ports
http_access allow CONNECT SSH_tunnel_ports

# Plain GET-style payloads may only proxy to web ports.
http_access allow Web_ports

# Everything else is denied: no open proxy, no arbitrary-port CONNECT.
http_access deny CONNECT
http_access deny all

# Leniency settings (mimics Squid 4.8 header tolerance)
relaxed_header_parser on

# Anonymity & Anti-Detection
via off
forwarded_for delete
request_header_access Via deny all
request_header_access X-Forwarded-For deny all
request_header_access Proxy-Connection deny all
request_header_access Server deny all

# Caching & Resource Limits
dns_nameservers 1.1.1.1 8.8.8.8
cache_mem 64 MB
maximum_object_size 4 MB
