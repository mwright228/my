worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

    # Upstream DNS resolver for dynamic reverse-proxying (Apple camouflage)
    resolver 1.1.1.1 8.8.8.8 valid=300s;

# Subscription endpoint rate limiting (protects tokens against scanning)
limit_req_zone $binary_remote_addr zone=mubx_sub:10m rate=10r/s;

# --- HTTP Port 80 (Plaintext Bug-Hosts & ACME Webroot) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /vless-ws {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
    }

    location /vmess-ws {
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
    }

    location /trojan-ws {
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
    }

    location /vless-httpupgrade {
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
    }

    location /vless-xhttp {
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vless-grpc {
        grpc_pass grpc://127.0.0.1:10020;
        client_max_body_size 0;
        grpc_read_timeout 86400s;
        grpc_send_timeout 86400s;
        grpc_set_header X-Real-IP $remote_addr;
    }

    location __SSH_WS_PATH__ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Per-user subscription requests on port 80 redirect to HTTPS (protects tokens)
    location /sub/ {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass https://www.apple.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.apple.com;
        proxy_set_header Host www.apple.com;
        proxy_set_header Accept-Encoding "";
        proxy_set_header User-Agent $http_user_agent;
        sub_filter_once off;
        sub_filter 'www.apple.com' '$host';
    }

    # One Shadowsocks WS route per user (expanded by lib/render.sh).
    #MUBX_SS_LOCATIONS#
}

# --- Loopback SSL Port 20443 (Universal Bug-Host TLS) ---
# Enables HTTP/2 for gRPC multiplexing alongside HTTP/1.1 WebSockets & HTTPUpgrade.
server {
    listen 127.0.0.1:20443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    location /vless-ws {
        proxy_pass http://127.0.0.1:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vmess-ws {
        proxy_pass http://127.0.0.1:10002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /trojan-ws {
        proxy_pass http://127.0.0.1:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location __SSH_WS_PATH__ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vless-httpupgrade {
        proxy_pass http://127.0.0.1:10004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vless-xhttp {
        proxy_pass http://127.0.0.1:10005;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /vless-grpc {
        grpc_pass grpc://127.0.0.1:10020;
        client_max_body_size 0;
        grpc_read_timeout 86400s;
        grpc_send_timeout 86400s;
        grpc_set_header X-Real-IP $remote_addr;
    }

    # Per-user subscription files (static, generated by mubx-sub; the token
    # in the path is the only credential). Rate-limited to prevent brute-force probing.
    location /sub/ {
        limit_req zone=mubx_sub burst=20 nodelay;
        alias /var/www/mubx-sub/;
        autoindex off;
        add_header Cache-Control "no-store";
    }

    # Dynamic Website Camouflage (Anti-Probing Reverse Proxy)
    location / {
        proxy_pass https://www.apple.com;
        proxy_ssl_server_name on;
        proxy_ssl_name www.apple.com;
        proxy_set_header Host www.apple.com;
        proxy_set_header Accept-Encoding "";
        proxy_set_header User-Agent $http_user_agent;
        sub_filter_once off;
        sub_filter 'www.apple.com' '$host';
    }

    # One Shadowsocks WS route per user (expanded by lib/render.sh).
    #MUBX_SS_LOCATIONS#
}

}

