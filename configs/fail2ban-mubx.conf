# MUB-X fail2ban jails. Installed to /etc/fail2ban/jail.d/mubx.conf by
# install.sh. Only Dropbear is jailed: its ports (2222/109) carry
# password-authenticated tunnel accounts and are exposed to the internet.
# The operator's own SSH (usually 22/OpenSSH) is deliberately not touched.

[dropbear]
enabled  = true
port     = 2222,109
filter   = dropbear
logpath  = /var/log/auth.log
maxretry = 5
findtime = 600
bantime  = 600
