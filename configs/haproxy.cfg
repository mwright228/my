# MUB-X HAProxy 443 demultiplexer (public port 443).
#
# One listener, three worlds, split by the first bytes:
#   * TLS ClientHello carrying the ShadowTLS decoy SNI (__SHADOWTLS_SNI__)
#     -> srv_singbox: sing-box's ShadowTLS v3 inbound on loopback 8448. The
#        decoy handshake is indistinguishable from a real TLS session to
#        that site, so it rides the same public 443 as everything else.
#   * any other TLS ClientHello (your domain, a carrier bug-host, anything)
#     -> srv_nginx: the loopback TLS terminator (127.0.0.1:20443), which
#        routes every /ws and /ss-<user> WebSocket transport to Xray.
#   * anything that is not a TLS hello (raw Shadowsocks AEAD packets)
#     -> srv_ss443: the shared SS-443 Xray inbound on loopback 17000, which
#        is what makes "Shadowsocks TCP on 443" work without a plugin.
#
# The bare final `accept` releases non-TLS connections the moment their
# first bytes rule out a TLS hello, so raw Shadowsocks is not held back by
# the inspect window; the delay only bounds pathological trickle senders.

global
    log /dev/log local0
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 86400s
    timeout server 86400s

frontend mubx_443
    bind :::443 v4v6
    mode tcp
    tcp-request inspect-delay 3s
    use_backend srv_singbox if { req.ssl_sni -i __SHADOWTLS_SNI__ }
    use_backend srv_nginx if { req_ssl_hello_type 1 }
    tcp-request content accept if { req_ssl_hello_type 1 }
    tcp-request content accept
    default_backend srv_ss443

backend srv_singbox
    mode tcp
    server srv_singbox 127.0.0.1:8448

backend srv_nginx
    mode tcp
    server srv_nginx 127.0.0.1:20443

backend srv_ss443
    mode tcp
    server srv_ss443 127.0.0.1:17000
