# MUB-X HAProxy L4 SNI router (public port 443).
#
# The two #MUBX_* markers below are expanded at install time and by
# `reality-fronts` (menu option 10) into one exact-SNI acl and backend per
# configured Reality front (see lib/reality-build.sh). A "front" is any real
# HTTPS site your clients' carriers allow as SNI - Apple, Google, Microsoft,
# CDN edges, whatever works on their SIM. Non-Reality traffic (your domain,
# carrier bug-hosts, mismatched SNIs) always falls through to the universal
# loopback TLS terminator in the default backend.

global
    log /dev/log local0
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 86400s
    timeout server 86400s

frontend sni_in_443
    bind 0.0.0.0:443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # One Reality backend per configured front (exact SNI match).
#MUBX_REALITY_RULES#

    # Universal fallback: anything that is not a configured Reality front
    # (your domain, carrier bug-hosts, spoofed SNIs) terminates here.
    default_backend srv_nginx

backend srv_nginx
    mode tcp
    server srv_nginx 127.0.0.1:20443

#MUBX_REALITY_BACKENDS#
